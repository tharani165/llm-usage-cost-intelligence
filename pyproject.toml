[project]
name = "llm-usage-cost-intelligence"
version = "0.1.0"
description = "Databricks lakehouse for synthetic LLM usage and cost analytics (portfolio project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyspark>=3.5"]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
